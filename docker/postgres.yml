services:
  postgres:
    image: postgres:18.6
    ports: ["127.0.0.1::5432"]
    environment:
      POSTGRES_DB: crudeval
      POSTGRES_PASSWORD: crudeval
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "crudeval"]
      interval: 1s
      timeout: 2s
      retries: 60
volumes:
  postgres-data:
